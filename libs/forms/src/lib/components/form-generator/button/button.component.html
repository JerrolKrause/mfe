<p-button
  *ngIf="button() && (visible$ | async)"
  class="form-generator-button"
  [attr.id]="button()?.id || null"
  [ngClass]="button()?.cssClasses"
  [ngStyle]="inlineStyles()"
  [label]="button()?.label"
  (click)="clickEvent()"
  [outlined]="button()?.outlined"
  [disabled]="disabled$ | async"
/>
