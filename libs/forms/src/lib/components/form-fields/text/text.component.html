<div class="input-text">
  <lib-input
    [label]="label()"
    [placeholder]="placeholder"
    [prefix]="prefix()"
    [suffix]="suffix()"
    [hint]="hint()"
    [automationId]="automationId"
    [control]="formControl"
    [validators]="validators"
    [id]="id || formFieldID"
  >
    <input
      #input
      class="p-inputtext p-component p-element"
      type="text"
      [id]="id || formFieldID"
      [name]="name || (label || placeholder | slug)"
      [ngClass]="styleClass"
      [placeholder]="placeholder ?? ''"
      [maxlength]="maxLength ?? ''"
      (focus)="focus($event)"
      (blur)="blur($event)"
      (keyup)="keyupEvent.emit($event)"
      (click)="clickEvent.emit($event)"
      [formControl]="formControl"
    />
  </lib-input>
</div>
