<lib-input
  class="input-selectbutton"
  [class.input-selectbutton-full]="fullWidth"
  [class.input-selectbutton-vertical]="stacked"
  [label]="label()"
  [placeholder]="placeholder"
  [prefix]="prefix()"
  [suffix]="suffix()"
  [hint]="hint()"
  [automationId]="automationId"
  [control]="formControl"
  [validators]="validators"
  [id]="id || formFieldID"
>
  <p-selectButton
    *ngIf="options?.length; else noOptions"
    [formControl]="formControl"
    [id]="id || formFieldID"
    [options]="options ?? []"
    [multiple]="multiple ?? false"
    [dataKey]="dataKey ?? ''"
    optionLabel="label"
    optionValue="value"
    (onOptionClick)="onOptionClick($event)"
  />
</lib-input>

<ng-template #noOptions>
  <em>No options supplied for this select button</em>
</ng-template>
